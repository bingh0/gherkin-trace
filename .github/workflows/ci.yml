# treecontext comes from the registry (treecontext-mcp, installed as the
# devDependency `treecontext`), so CI is a plain checkout + npm ci. gt's
# SQLite is Node's built-in node:sqlite, so there is no native build; the
# Linux lanes span the Node floor (24.16, pinned exactly so the floor is
# witnessed, not assumed) to current, and the macOS and Windows lanes stay
# because what consumers install is the packed tarball and the suite
# touches file modes and paths — source passing on Linux is not the
# artifact working elsewhere, so every lane ends by installing and running
# the tarball.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A superseded run's minutes buy nothing — cancel it when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['24.16.0', '24.x', '26.x']
        include:
          - os: macos-latest
            node-version: '24.x'
          - os: windows-latest
            node-version: '24.x'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No install scripts to approve: nothing in the tree builds natively.
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # The artifact, not the source: pack, install the tarball into a fresh
      # consumer project beside its required peer, and run the installed
      # binary. treecontext is an optional peer the smoke leaves out, so the
      # refresh runs with the journal dark, as a first install does.
      - name: Smoke the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          smoke="$RUNNER_TEMP/gt-smoke"
          mkdir -p "$smoke"
          printf '{"name":"gt-smoke","private":true}\n' > "$smoke/package.json"
          (cd "$smoke" && npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tgz" gherkin-node-test)
          gt="$smoke/node_modules/.bin/gherkin-trace"
          "$gt" --version
          "$gt" refresh --root "$GITHUB_WORKSPACE"
          "$gt" report --root "$GITHUB_WORKSPACE" | head -20
